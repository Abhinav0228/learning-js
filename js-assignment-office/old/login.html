<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Login Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
</head>

<body>
  <div class="login-container">
    <h1>Login</h1>
    <form id="loginForm">
      <div class="mb-3 text-start">
        <label for="email" class="form-label">E-mail Address</label>
        <input type="email" id="email" name="email" class="form-control p-2" required>
      </div>
      <div class="mb-3 text-start">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control p-2" required>
      </div>
      <div class="d-flex justify-content-between mb-2">
        <a href="/reset.html" class="link">Reset password</a>
        <a href="/sign-up.html" class="link">Not an user?</a>
      </div>
      <button type="submit" class="btn w-100 p-2 fw-bold">Login</button>
    </form>
  </div>


  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
  <script src="/script/login.js"></script>
</body>

</html>
