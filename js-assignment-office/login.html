<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        <form id="login-form">
          <div class="mb-3 text-start">
            <label for="email" class="form-label">E-mail Address</label>
            <input type="email" id="email" name="email" class="form-control p-2" required>
            <div id="emailError" class="invalid-feedback"></div>
          </div>
          <div class="mb-3 text-start">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control p-2" required>
            <div class="show-pass d-flex align-items-center mt-2">
                <input type="checkbox" id="show-password" class="pass-inp"> 
                <label for="show-password" class="pass-label d-flex align-items-center">Show Password</label>
            </div>
          </div>
          
          <div class="d-flex justify-content-between mb-2">
            <a href="/reset.html" class="link">Reset password</a>
            <a href="/sign-up.html" class="link">Create an account</a>
          </div>
          <button type="submit" class="btn w-100 p-2 fw-bold">Login</button>
        </form>
      </div>
  <script src="/script/login.js"></script>
</body>
</html>
