<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/sign-up.css">
</head>
<body>

    <div class="row justify-content-center sign-up-container">
        <div class="col-md-12 p-0">
            <h2 class="text-center mb-5">Signup</h2>
            <form id="signupForm">
                <div class="mb-3">
                    <label for="name" class="form-label d-block text-start">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label d-block text-start">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                    <div id="emailError" class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label d-block text-start">Password</label>
                    <input type="password" class="form-control" id="password" name="password" minlength="6" required>
                </div>
                <div class="show-pass d-flex align-items-center mt-1 mb-3">
                    <input type="checkbox" id="show-password" class="pass-inp"> 
                    <label for="show-password" class="pass-label d-flex align-items-center">Show Password</label>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label d-block text-start">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                </div>
                <div class="show-pass d-flex align-items-center mt-1 mb-3">
                    <input type="checkbox" id="show-password1" class="pass-inp"> 
                    <label for="show-password1" class="pass-label d-flex align-items-center">Show Password</label>
                </div>
                <div class="d-flex justify-content-end">
                    <a href="/login.html" class="link">Already have an account?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3 text-black fw-bold p-2">Sign Up</button>
            </form>
        </div>
        <p id="message"></p>
    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent form from refreshing

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            fetch("http://localhost:5000/signup", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ name, email, password })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("message").innerText = data.message;
            })
            .catch(error => console.error("Error:", error));
        });
    </script>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
</body>
</html>
