<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/reset.css">
</head>
<body>
    <div class="row justify-content-center reset-container">
        <div class="col-md-12 p-0">
            <h2 class="text-center mb-4">Reset Password</h2>
            <form id="resetPasswordForm">
                <div class="mb-3">
                    <label for="email" class="form-label w-100 d-block text-start">Email Address</label>
                    <input type="email" class="form-control p-2" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="oldPassword" class="form-label w-100 d-block text-start">Old Password</label>
                    <input type="password" class="form-control p-2" id="oldPassword" name="oldPassword" required>
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label w-100 d-block text-start">New Password</label>
                    <input type="password" class="form-control p-2" id="newPassword" name="newPassword" required>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label w-100 d-block text-start">Confirm New Password</label>
                    <input type="password" class="form-control p-2" id="confirmPassword" name="confirmPassword" required>
                </div>
                <div class="d-flex justify-content-end">
                    <a href="/login.html" class="link">back to login</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3 text-black fw-bold p-2">Reset Password</button>
            </form>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
    <script src="/script/reset.js"></script>
</body>
</html>
